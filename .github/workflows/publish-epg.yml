name: Publish XMLTV guide

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: xmltv-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate XMLTV
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: >-
          python src/generate_epg.py
          --previous-url https://github.com/ussefom/mi-epg/releases/latest/download/movistar.xml.gz
          --previous-url https://ussefom.github.io/mi-epg/movistar.xml.gz
          --output-dir release-assets
      - name: Validate release assets
        run: >-
          python src/validate_release.py release-assets
          --require-channel TVE
          --require-channel SEXTA
          --require-channel MPLUS
      - name: Publish immutable GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python src/publish_release.py
          --assets-dir release-assets
          --repository ${{ github.repository }}
          --keep 5
